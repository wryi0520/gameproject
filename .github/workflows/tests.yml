name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  gut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false

      - name: Import project
        run: godot --headless --path . --import

      - name: Run GUT tests
        run: godot --headless --path . -s addons/gut/gut_cmdln.gd -gexit -gconfig=.gutconfig.json
